<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI 饥饿秀</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <!-- 演出区（占位）：后续用 2D 像素 sprite 在这块 canvas 上演出 -->
      <section class="stage px-box" aria-label="演出区">
        <canvas id="stage-canvas" width="160" height="68"></canvas>
        <span class="live-badge" id="live-badge" data-state="off"><i class="dot"></i><b class="txt">LIVE</b></span>
        <span class="stage-tag" id="stage-tag"></span>
        <!-- 演出暂停：两条警戒线把舞台封起来，中间挂一块「维修中」的牌子 -->
        <div class="stage-closed" id="stage-closed" hidden>
          <div class="tape tape-a"><span></span></div>
          <div class="tape tape-b"><span></span></div>
          <div class="sign" role="status">
            <i class="rope l"></i><i class="rope r"></i>
            <div class="board"><b>维修中</b><small id="stage-closed-why">演出暂停</small></div>
          </div>
          <span class="sprite cone l" data-sprite="cone"></span>
          <span class="sprite cone r" data-sprite="cone"></span>
        </div>
      </section>

      <!-- 2×2 按钮：“墓园”会弹出墓园，其余先占位 -->
      <nav class="menu" aria-label="菜单">
        <button class="px-box px-btn" type="button" data-action="scripture">
          <span class="sprite" data-sprite="scroll"></span><span class="label">圣言</span>
        </button>
        <button class="px-box px-btn" type="button" data-action="music" aria-pressed="false">
          <span class="sprite" data-sprite="note"></span><span class="label">音乐·关</span>
        </button>
        <button class="px-box px-btn" type="button" data-action="graveyard">
          <span class="sprite" data-sprite="tomb"></span><span class="label">墓园</span>
        </button>
        <button class="px-box px-btn" type="button" data-action="info">
          <span class="sprite" data-sprite="info"></span><span class="label">信息</span>
        </button>
      </nav>
    </header>

    <!-- 环境与选手的对话 -->
    <section id="chat" class="chat" aria-live="polite" aria-label="对话"></section>
  </main>

  <!-- 墓园：墓碑列表 / 人物生平 -->
  <div id="roles" class="modal" role="dialog" aria-modal="true" aria-labelledby="roles-title" hidden>
    <div class="modal-panel px-box">
      <header class="modal-head">
        <button class="px-box px-btn px-btn-s" id="roles-back" type="button" hidden>返回</button>
        <h2 id="roles-title">墓园</h2>
        <button class="px-box px-btn px-btn-s" id="roles-close" type="button">关闭</button>
      </header>
      <div class="modal-body" id="roles-body"></div>
    </div>
  </div>

  <!-- 圣言：这个世界的每一条世界观，以及它被触发过几次 -->
  <div id="scripture" class="modal" role="dialog" aria-modal="true" aria-labelledby="scripture-title" hidden>
    <div class="modal-panel px-box">
      <header class="modal-head">
        <h2 id="scripture-title">圣言</h2>
        <button class="px-box px-btn px-btn-s" id="scripture-close" type="button">关闭</button>
      </header>
      <div class="modal-body" id="scripture-body"></div>
    </div>
  </div>

  <!-- 信息：上面两个标签页切换——游戏规则（讲给观众听的）/ 特殊角色（像圣言一样，出现过才解锁） -->
  <div id="info" class="modal" role="dialog" aria-modal="true" aria-label="信息" hidden>
    <div class="modal-panel px-box">
      <header class="modal-head">
        <button class="px-box px-btn px-btn-s" id="info-back" type="button" hidden>返回</button>
        <nav class="tabs" role="tablist" aria-label="信息">
          <button class="tab" type="button" role="tab" data-tab="rules" aria-selected="true">游戏规则</button>
          <button class="tab" type="button" role="tab" data-tab="specials" aria-selected="false">特殊角色</button>
        </nav>
        <button class="px-box px-btn px-btn-s" id="info-close" type="button">关闭</button>
      </header>
      <div class="modal-body" id="info-body" role="tabpanel"></div>
    </div>
  </div>

  <div id="toast" class="toast px-box" role="status" hidden></div>

  <!-- 音乐清单（由 python -m ai_related.playlist 生成；服务器每次启动都会重写）。用相对路径，
       双击打开、Live Server、python 服务器三种方式都能找到 -->
  <script src="../music/playlist.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/stage.js"></script>
  <script src="js/votes.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/roles.js"></script>
  <script src="js/scripture.js"></script>
  <script src="js/info.js"></script>
  <script src="js/music.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
